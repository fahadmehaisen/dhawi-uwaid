<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>اللوحة الجدارية الفاخرة لشجرة ذوي عويض — ٧٦٠ اسماً</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo-seal-clean.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --emerald: #12372A;
      --emerald-deep: #0B241B;
      --gold: #C9A45A;
      --gold-light: #E2C88B;
      --ivory: #F7F0DF;
      --surface: #FFFDF8;
      --border: rgba(226, 200, 139, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Tajawal', sans-serif;
      background: #17231E;
      color: #FFFDF8;
      -webkit-tap-highlight-color: transparent;
    }
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }

    /* Header */
    .bar {
      background: linear-gradient(135deg, #0B241B 0%, #12372A 100%);
      border-bottom: 1.5px solid var(--gold);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 40;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      text-decoration: none;
    }
    .brand img.wm { height: 34px; width: auto; display: block; flex-shrink: 0; }
    .brand-copy { min-width: 0; }
    .brand-title {
      font-family: 'Amiri', serif;
      font-size: 1rem;
      font-weight: 700;
      color: #FFFDF8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand small {
      color: var(--gold-light);
      font-size: 0.72rem;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Search */
    .search-wrap {
      position: relative;
      flex: 1 1 250px;
      max-width: 340px;
    }
    .search-input {
      width: 100%;
      height: 36px;
      padding: 0 34px 0 30px;
      border-radius: 999px;
      border: 1px solid rgba(226, 200, 139, 0.45);
      background: rgba(255, 255, 255, 0.1);
      color: #FFFDF8;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.85rem;
      outline: none;
    }
    .search-input::placeholder { color: rgba(247, 240, 223, 0.68); }
    .search-input:focus {
      border-color: var(--gold-light);
      background: rgba(11, 36, 27, 0.85);
    }
    .search-ico {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      pointer-events: none;
      opacity: 0.8;
    }
    .search-clear {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      color: #FFFDF8;
      font-size: 0.75rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .search-clear.show { display: inline-flex; }
    .search-results {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      left: 0;
      max-height: 280px;
      overflow-y: auto;
      background: #102B21;
      border: 1px solid var(--gold);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.48);
      display: none;
      z-index: 80;
    }
    .search-results.open { display: block; }
    .sr-item {
      padding: 9px 12px;
      border-bottom: 1px solid rgba(226, 200, 139, 0.16);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: right;
      width: 100%;
      background: transparent;
      border-left: none;
      border-right: none;
      border-top: none;
      color: #FFFDF8;
      font-family: inherit;
    }
    .sr-item:hover, .sr-item:focus { background: rgba(201, 164, 90, 0.2); }
    .sr-item strong { font-size: 0.88rem; color: #FFFDF8; }
    .sr-item span { font-size: 0.73rem; color: var(--gold-light); }
    .sr-empty { padding: 12px; font-size: 0.82rem; color: var(--gold-light); text-align: center; }

    /* Actions */
    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      flex-shrink: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 35px;
      padding: 0 12px;
      border-radius: 9px;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.79rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid rgba(226, 200, 139, 0.42);
      background: rgba(255,255,255,0.08);
      color: #FFFDF8;
      transition: background 0.15s;
    }
    .btn:hover { background: rgba(255,255,255,0.18); }
    .btn-gold { background: var(--gold); color: #16140F; border-color: var(--gold); }
    .btn-gold:hover { background: var(--gold-light); }
    .btn-emerald { background: #1B543E; color: #FFFDF8; }
    .btn-icon { width: 35px; padding: 0; font-size: 1rem; border-radius: 50%; }

    /* Mobile download menu */
    .dl-menu-wrap { position: relative; display: none; }
    .dl-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 220px;
      background: #102B21;
      border: 1px solid var(--gold);
      border-radius: 12px;
      box-shadow: 0 16px 38px rgba(0,0,0,0.5);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 80;
    }
    .dl-dropdown.open { display: flex; }
    .dl-dropdown a {
      padding: 9px 11px;
      border-radius: 8px;
      color: #FFFDF8;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.05);
    }
    .dl-dropdown a.primary { background: var(--gold); color: #16140F; }

    /* Branch Quick Jump Bar */
    .branch-bar {
      background: #10281F;
      border-bottom: 1px solid rgba(226, 200, 139, 0.22);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
      z-index: 30;
    }
    .branch-bar::-webkit-scrollbar { display: none; }
    .branch-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(226, 200, 139, 0.28);
      background: rgba(255,255,255,0.06);
      color: #F7F0DF;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.77rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }
    .branch-pill.active {
      background: var(--gold);
      color: #16140F;
      border-color: var(--gold);
    }
    .branch-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Interactive Stage */
    .viewport {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: radial-gradient(circle at center, #25362E 0%, #16221C 100%);
      touch-action: none;
      cursor: grab;
      user-select: none;
    }
    .viewport.dragging { cursor: grabbing; }
    #mural-stage-inner {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      background: #F7F0DF;
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      width: 4200px;
      height: 5940px;
    }
    #mural-stage-inner.smooth {
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #mural-stage-inner svg,
    #mural-stage-inner img {
      width: 4200px;
      height: 5940px;
      display: block;
    }
    .mural-node { cursor: pointer; }
    .mural-node-highlight path,
    .mural-node-highlight rect,
    .mural-node-highlight circle {
      stroke: #D49A1A !important;
      stroke-width: 7px !important;
      filter: drop-shadow(0 0 18px rgba(212, 154, 26, 0.95));
    }

    /* Floating Info Card & Zoom HUD */
    .selected-pill {
      position: absolute;
      top: 10px;
      right: 12px;
      left: 12px;
      margin: 0 auto;
      max-width: 520px;
      background: rgba(11, 36, 27, 0.94);
      border: 1.5px solid var(--gold);
      border-radius: 12px;
      padding: 8px 12px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
      z-index: 35;
      backdrop-filter: blur(8px);
    }
    .selected-pill.show { display: flex; }
    .selected-pill strong {
      font-family: 'Amiri', serif;
      font-size: 1rem;
      color: var(--gold-light);
      display: block;
    }
    .selected-pill span {
      font-size: 0.77rem;
      color: #FFFDF8;
      display: block;
    }
    .selected-pill button {
      border: none;
      background: rgba(255,255,255,0.15);
      color: #FFFDF8;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
    }

    .zoom-hud {
      position: absolute;
      bottom: calc(14px + env(safe-area-inset-bottom));
      left: 14px;
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(11, 36, 27, 0.92);
      border: 1.5px solid rgba(226, 200, 139, 0.55);
      border-radius: 999px;
      padding: 5px 8px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
    }
    .zh-btn {
      height: 32px;
      min-width: 32px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid rgba(226, 200, 139, 0.35);
      background: rgba(255,255,255,0.08);
      color: #FFFDF8;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .zh-btn:hover { background: rgba(201, 164, 90, 0.25); }
    .zh-pct {
      font-size: 0.73rem;
      font-weight: 700;
      color: var(--gold-light);
      padding: 0 4px;
      min-width: 40px;
      text-align: center;
    }

    .stage-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      color: var(--gold-light);
      pointer-events: none;
    }
    .mobile-search-toggle { display: none; }

    /* Responsive Breakpoints */
    @media (max-width: 1023px) {
      .brand small { display: none; }
      .desk-extra { display: none; }
      .dl-menu-wrap { display: block; }
    }
    @media (max-width: 767px) {
      .bar { padding: 7px 10px; gap: 6px; }
      .brand img.wm { height: 28px; }
      .brand-title { font-size: 0.9rem; }
      .desk-a4-btn, .desk-back-lbl { display: none; }
      .mobile-search-toggle { display: inline-flex; }
      .search-wrap {
        display: none;
        position: fixed;
        top: 52px;
        right: 10px;
        left: 10px;
        max-width: none;
        z-index: 75;
        background: #0B241B;
        padding: 7px;
        border-radius: 12px;
        border: 1.5px solid var(--gold);
        box-shadow: 0 14px 34px rgba(0,0,0,0.5);
      }
      .search-wrap.open { display: block; }
      .search-input { font-size: 16px; height: 40px; }
      .branch-bar { padding: 5px 10px; }
      .branch-pill { padding: 4px 10px; font-size: 0.74rem; }
      .zoom-hud { left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="bar">
      <div class="brand">
        <img class="wm" src="../assets/logo-wordmark-clean.svg" alt="ذوي عويض" />
        <div class="brand-copy">
          <div class="brand-title">اللوحة الجدارية الفاخرة — ٧٦٠ اسماً</div>
          <small>من البصصة قبيلة الشدادين بني الحارث</small>

      </div>

        <a class="btn desk-extra" href="لوحة_شجرة_ذوي_عويض_الجدارية.png" download="لوحة_شجرة_ذوي_عويض_الجدارية.png">صورة PNG</a>
        <a class="btn desk-extra" href="dhawi-uwaid-wall-mural.svg" download="شجرة_ذوي_عويض_الجدارية.svg">ملف SVG</a>

        <div class="dl-menu-wrap">
          <button type="button" id="dl-menu-btn" class="btn btn-gold">تحميل وطباعة ▾</button>
          <div class="dl-dropdown" id="dl-dropdown">
            <a class="primary" href="شجرة_ذوي_عويض_طباعة_A4_واضحة.pdf" download="شجرة_ذوي_عويض_طباعة_A4_واضحة.pdf"><span>طباعة A4 واضحة (٧ صفحات)</span><span>PDF</span></a>
            <a href="لوحة_شجرة_ذوي_عويض_الجدارية.pdf" download="لوحة_شجرة_ذوي_عويض_الجدارية.pdf"><span>اللوحة الجدارية الكاملة</span><span>PDF</span></a>
            <a href="لوحة_شجرة_ذوي_عويض_الجدارية.png" download="لوحة_شجرة_ذوي_عويض_الجدارية.png"><span>صورة فائقة الوضوح</span><span>PNG</span></a>
            <a href="dhawi-uwaid-wall-mural.svg" download="شجرة_ذوي_عويض_الجدارية.svg"><span>الملف المتجهي الأصلي</span><span>SVG</span></a>

        <a class="btn" href="../index.html" title="العودة للشجرة التفاعلية">↩ <span class="desk-back-lbl">العودة للشجرة</span></a>

    </header>

    <nav class="branch-bar" aria-label="الانتقال السريع للفروع">
      <button type="button" class="branch-pill active" data-branch="ALL">اللوحة كاملة</button>
      <button type="button" class="branch-pill" data-branch="B08"><span class="branch-dot" style="background:#144B37"></span>ماضي (٢٢٦)</button>
      <button type="button" class="branch-pill" data-branch="B06"><span class="branch-dot" style="background:#8A3838"></span>ثويني (١٩٦)</button>
      <button type="button" class="branch-pill" data-branch="B07"><span class="branch-dot" style="background:#48447A"></span>جرار (١٥١)</button>
      <button type="button" class="branch-pill" data-branch="B05"><span class="branch-dot" style="background:#A8701E"></span>سمران (١٠١)</button>
      <button type="button" class="branch-pill" data-branch="B01"><span class="branch-dot" style="background:#1B6851"></span>قليشان (٦٠)</button>
      <button type="button" class="branch-pill" data-branch="B04"><span class="branch-dot" style="background:#315D73"></span>دغيليب (١٣)</button>
      <button type="button" class="branch-pill" data-branch="B03"><span class="branch-dot" style="background:#58683C"></span>دهران (١)</button>
      <button type="button" class="branch-pill" data-branch="B02"><span class="branch-dot" style="background:#8A5A2B"></span>مضيان (١)</button>

    <main class="viewport" id="viewport">
      <div class="stage-loading" id="stage-loading">جارٍ تحميل اللوحة المتجهية الفاخرة...</div>
      <div id="mural-stage-inner"></div>

      <div class="selected-pill" id="selected-pill">
        <div>
          <strong id="sel-name"></strong>
          <span id="sel-lineage"></span>
        </div>
        <button type="button" id="sel-close" aria-label="إغلاق">✕</button>
      </div>

      <div class="zoom-hud" aria-label="أدوات التكبير">
        <button type="button" class="zh-btn" id="z-in" title="تكبير">+</button>
        <button type="button" class="zh-btn" id="z-out" title="تصغير">−</button>
        <button type="button" class="zh-btn" id="z-fit" title="عرض اللوحة كاملة">ملاءمة</button>
        <span class="zh-pct" id="z-pct">١٠٠٪</span>
      </div>
    </main>

  <script>
    const SVG_W = 4200;
    const SVG_H = 5940;
    const viewport = document.getElementById("viewport");
    const stage = document.getElementById("mural-stage-inner");
    const loadingEl = document.getElementById("stage-loading");
    const pctEl = document.getElementById("z-pct");

    const state = { scale: 0.2, tx: 0, ty: 0, fitScale: 0.2, nodes: [] };
    const toAr = (n) => String(Math.round(n)).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);

    function applyTransform(animate = false) {
      stage.classList.toggle("smooth", animate);
      stage.style.transform = `translate3d(${state.tx.toFixed(1)}px, ${state.ty.toFixed(1)}px, 0) scale(${state.scale.toFixed(4)})`;
      const relPct = (state.scale / state.fitScale) * 100;
      pctEl.textContent = toAr(relPct) + "٪";
    }

    function fitToScreen(animate = false) {
      const vw = viewport.clientWidth;
      const vh = viewport.clientHeight;
      const s = Math.min((vw - 16) / SVG_W, (vh - 16) / SVG_H);
      state.fitScale = s;
      state.scale = s;
      state.tx = (vw - SVG_W * s) / 2;
      state.ty = (vh - SVG_H * s) / 2;
      applyTransform(animate);
    }

    function zoomAt(targetScale, cx, cy, animate = false) {
      const clamped = Math.max(state.fitScale * 0.85, Math.min(state.fitScale * 14, targetScale));
      const wx = (cx - state.tx) / state.scale;
      const wy = (cy - state.ty) / state.scale;
      state.scale = clamped;
      state.tx = cx - wx * clamped;
      state.ty = cy - wy * clamped;
      applyTransform(animate);
    }

    function focusBox(minX, minY, maxX, maxY, minZoomScale = 0) {
      const vw = viewport.clientWidth;
      const vh = viewport.clientHeight;
      const bw = Math.max(180, maxX - minX);
      const bh = Math.max(140, maxY - minY);
      const s = Math.max(minZoomScale, Math.min((vw * 0.86) / bw, (vh * 0.82) / bh));
      const targetS = Math.min(state.fitScale * 12, Math.max(state.fitScale, s));
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      state.scale = targetS;
      state.tx = vw / 2 - cx * targetS;
      state.ty = vh / 2 - cy * targetS;
      applyTransform(true);
    }

    function normalizeAr(str) {
      return String(str || "")
        .replace(/[\u064B-\u065F\u0670\u2067\u2069]/g, "")
        .replace(/[أإآ]/g, "ا")
        .replace(/ة/g, "ه")
        .replace(/ى/g, "ي")
        .trim();
    }

    function parseTranslate(t) {
      const m = String(t || "").match(/translate\(\s*([-\d.]+)\s*[,\s]\s*([-\d.]+)/);
      return m ? { x: Number(m[1]), y: Number(m[2]) } : { x: 2100, y: 3680 };
    }

    let activeHighlight = null;
    function selectNode(nodeRec, shouldZoom = true) {
      if (activeHighlight) activeHighlight.classList.remove("mural-node-highlight");
      nodeRec.el.classList.add("mural-node-highlight");
      activeHighlight = nodeRec.el;
      document.getElementById("sel-name").textContent = nodeRec.name;
      document.getElementById("sel-lineage").textContent = nodeRec.lineage;
      document.getElementById("selected-pill").classList.add("show");
      if (shouldZoom) {
        const z = viewport.clientWidth < 768 ? state.fitScale * 4.8 : state.fitScale * 3.4;
        focusBox(nodeRec.x - 120, nodeRec.y - 70, nodeRec.x + 120, nodeRec.y + 70, z);
      }
    }

    async function loadMural() {
      try {
        const res = await fetch("dhawi-uwaid-wall-mural.svg");
        if (!res.ok) throw new Error("fetch failed");
        const txt = await res.text();
        const svgIdx = txt.indexOf("<svg");
        stage.innerHTML = svgIdx >= 0 ? txt.slice(svgIdx) : txt;
        const svgEl = stage.querySelector("svg");
        svgEl.removeAttribute("width");
        svgEl.removeAttribute("height");
        svgEl.style.width = "4200px";
        svgEl.style.height = "5940px";
        loadingEl.style.display = "none";

        state.nodes = [...svgEl.querySelectorAll(".mural-node")].map((el) => {
          const pt = parseTranslate(el.getAttribute("transform"));
          const rec = {
            id: el.getAttribute("data-node-id"),
            branchId: el.getAttribute("data-branch-id"),
            name: el.getAttribute("data-name") || "",
            lineage: el.getAttribute("data-lineage") || "",
            norm: normalizeAr((el.getAttribute("data-name") || "") + " " + (el.getAttribute("data-lineage") || "")),
            x: pt.x,
            y: pt.y,
            el,
          };
          el.addEventListener("click", (e) => {
            if (movedDist > 8) return;
            e.stopPropagation();
            selectNode(rec, false);
          });
          return rec;
        });
      } catch (_) {
        stage.innerHTML = '<img src="dhawi-uwaid-wall-mural.svg" alt="اللوحة الجدارية لشجرة ذوي عويض" />';
        loadingEl.style.display = "none";
      }
      fitToScreen(false);
    }

    // Gesture Engine: Drag Pan + Wheel Zoom + 2-Finger Pinch + Double Tap
    let pointers = new Map();
    let dragStart = null;
    let pinchStart = null;
    let movedDist = 0;
    let lastTap = 0;

    viewport.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".zoom-hud, .selected-pill")) return;
      viewport.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      movedDist = 0;
      if (pointers.size === 1) {
        viewport.classList.add("dragging");
        dragStart = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty };
        pinchStart = null;
      } else if (pointers.size === 2) {
        const pts = [...pointers.values()];
        const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        const mx = (pts[0].x + pts[1].x) / 2 - viewport.getBoundingClientRect().left;
        const my = (pts[0].y + pts[1].y) / 2 - viewport.getBoundingClientRect().top;
        pinchStart = { dist, scale: state.scale, tx: state.tx, ty: state.ty, mx, my };
        dragStart = null;
      }
    });

    viewport.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2 && pinchStart) {
        const pts = [...pointers.values()];
        const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        const rect = viewport.getBoundingClientRect();
        const curMx = (pts[0].x + pts[1].x) / 2 - rect.left;
        const curMy = (pts[0].y + pts[1].y) / 2 - rect.top;
        const newScale = Math.max(state.fitScale * 0.85, Math.min(state.fitScale * 14, pinchStart.scale * (dist / Math.max(10, pinchStart.dist))));
        const wx = (pinchStart.mx - pinchStart.tx) / pinchStart.scale;
        const wy = (pinchStart.my - pinchStart.ty) / pinchStart.scale;
        state.scale = newScale;
        state.tx = curMx - wx * newScale;
        state.ty = curMy - wy * newScale;
        applyTransform(false);
      } else if (pointers.size === 1 && dragStart) {
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        movedDist = Math.max(movedDist, Math.hypot(dx, dy));
        state.tx = dragStart.tx + dx;
        state.ty = dragStart.ty + dy;
        applyTransform(false);
      }
    });

    function endPointer(e) {
      if (pointers.size === 1 && movedDist < 7 && !e.target.closest(".zoom-hud, .selected-pill")) {
        const now = Date.now();
        if (now - lastTap < 280) {
          const rect = viewport.getBoundingClientRect();
          const cx = e.clientX - rect.left;
          const cy = e.clientY - rect.top;
          if (state.scale > state.fitScale * 1.9) fitToScreen(true);
          else zoomAt(state.scale * 2.5, cx, cy, true);
          lastTap = 0;
        } else {
          lastTap = now;
        }
      }
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinchStart = null;
      if (pointers.size === 1) {
        const rem = [...pointers.values()][0];
        dragStart = { x: rem.x, y: rem.y, tx: state.tx, ty: state.ty };
      } else {
        dragStart = null;
        viewport.classList.remove("dragging");
      }
    }
    viewport.addEventListener("pointerup", endPointer);
    viewport.addEventListener("pointercancel", endPointer);

    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const factor = e.deltaY < 0 ? 1.18 : 1 / 1.18;
      zoomAt(state.scale * factor, e.clientX - rect.left, e.clientY - rect.top, false);
    }, { passive: false });

    document.getElementById("z-in").addEventListener("click", () => {
      zoomAt(state.scale * 1.4, viewport.clientWidth / 2, viewport.clientHeight / 2, true);
    });
    document.getElementById("z-out").addEventListener("click", () => {
      zoomAt(state.scale / 1.4, viewport.clientWidth / 2, viewport.clientHeight / 2, true);
    });
    document.getElementById("z-fit").addEventListener("click", () => fitToScreen(true));
    document.getElementById("sel-close").addEventListener("click", () => {
      if (activeHighlight) activeHighlight.classList.remove("mural-node-highlight");
      document.getElementById("selected-pill").classList.remove("show");
    });

    // Branch Quick Jump
    document.querySelectorAll(".branch-pill").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".branch-pill").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const bid = btn.getAttribute("data-branch");
        if (bid === "ALL" || !state.nodes.length) {
          fitToScreen(true);
          return;
        }
        const pts = state.nodes.filter((n) => n.branchId === bid);
        if (!pts.length) return;
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (const p of pts) {
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        }
        focusBox(minX - 150, minY - 120, maxX + 150, maxY + 120);
      });
    });

    // Search
    const searchWrap = document.getElementById("search-wrap");
    const searchInput = document.getElementById("mural-search");
    const searchClear = document.getElementById("mural-search-clear");
    const searchResults = document.getElementById("mural-search-results");

    document.getElementById("mobile-search-btn").addEventListener("click", () => {
      searchWrap.classList.toggle("open");
      if (searchWrap.classList.contains("open")) searchInput.focus();
    });

    searchInput.addEventListener("input", () => {
      const q = normalizeAr(searchInput.value);
      searchClear.classList.toggle("show", q.length > 0);
      if (!q) {
        searchResults.classList.remove("open");
        return;
      }
      const matches = state.nodes.filter((n) => n.norm.includes(q)).slice(0, 18);
      if (!matches.length) {
        searchResults.innerHTML = '<div class="sr-empty">لا توجد نتائج مطابقة</div>';
      } else {
        searchResults.innerHTML = matches.map((m, idx) =>
          `<button type="button" class="sr-item" data-idx="${idx}"><strong>${m.name}</strong><span>${m.lineage}</span></button>`
        ).join("");
        searchResults.querySelectorAll(".sr-item").forEach((el) => {
          el.addEventListener("click", () => {
            const picked = matches[Number(el.getAttribute("data-idx"))];
            selectNode(picked, true);
            searchResults.classList.remove("open");
            if (window.innerWidth <= 767) searchWrap.classList.remove("open");
          });
        });
      }
      searchResults.classList.add("open");
    });

    searchClear.addEventListener("click", () => {
      searchInput.value = "";
      searchClear.classList.remove("show");
      searchResults.classList.remove("open");
    });

    // Mobile Downloads Menu
    const dlBtn = document.getElementById("dl-menu-btn");
    const dlDrop = document.getElementById("dl-dropdown");
    dlBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      dlDrop.classList.toggle("open");
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".dl-menu-wrap")) dlDrop.classList.remove("open");
      if (!e.target.closest("#search-wrap") && !e.target.closest("#mobile-search-btn")) {
        searchResults.classList.remove("open");
      }
    });

    window.addEventListener("resize", () => fitToScreen(false));
    loadMural();
  </script>
</body>
</html>
