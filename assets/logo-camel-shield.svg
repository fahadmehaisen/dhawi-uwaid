      <stop offset="0%" stop-color="#E7C677"/>
      <stop offset="50%" stop-color="#C59B43"/>
      <stop offset="100%" stop-color="#987021"/>
    </linearGradient>
  </defs>

  <!-- Minimalist Octagonal Desert Shield (8 sons) -->
  <polygon points="82,16 158,16 218,76 218,154 158,218 82,218 22,154 22,76"
