  <path d="M74 182 H166" stroke="url(#goldGrad2)" stroke-width="1.6" stroke-opacity="0.8"/>
  <polygon points="120,175 127,182 120,189 113,182" fill="#12372A" stroke="url(#goldGrad2)" stroke-width="2"/>
