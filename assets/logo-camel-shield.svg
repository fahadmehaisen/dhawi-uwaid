  <path d="M40 156 L84 114 L112 140 L152 104 L200 156 Z" fill="#1B4D3B"/>
  <path d="M40 156 L84 114 L112 140 L152 104 L200 156" stroke="url(#goldGrad2)" stroke-width="2" stroke-linejoin="round" fill="none"/>

  <!-- Stylized Arabian Camel Head & Neck Profile (وسم الإبل) -->
  <path d="M88 164 C92 138 96 112 96 92 C96 72 104 54 122 48 C134 44 148 46 158 51 C166 55 170 61 167 66 C164 71 154 72 146 71 C138 70 132 72 128 79 C123 88 124 106 128 124 C132 140 138 154 146 164 Z"
        fill="url(#goldGrad2)"/>
  <!-- Refined ear & brow silhouette detail -->
  <path d="M116 50 L112 40 L122 47" fill="url(#goldGrad2)"/>
  <circle cx="144" cy="57" r="2.3" fill="#12372A"/>

  <!-- Desert Dune Horizon & Traditional Geometric Wasm Accent -->
