<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" fill="none" role="img" aria-label="شعار ذوي عويض — حصن قيا والمطية العربية">
  <defs>
    <linearGradient id="goldGrad1" x1="20" y1="15" x2="220" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2BE6E"/>
      <stop offset="50%" stop-color="#C59B43"/>
      <stop offset="100%" stop-color="#9A7426"/>
    </linearGradient>
    <linearGradient id="emeraldGrad1" x1="120" y1="10" x2="120" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#184737"/>
      <stop offset="100%" stop-color="#0D291F"/>
    </linearGradient>
  </defs>

  <!-- Outer 8-faceted heritage shield (8 sons of Uwaid) -->
  <path d="M120 10 L204 42 L224 128 C224 188 176 232 120 250 C64 232 16 188 16 128 L36 42 Z"
        fill="url(#emeraldGrad1)" stroke="url(#goldGrad1)" stroke-width="4.5"/>
  <path d="M120 21 L195 50 L213 128 C213 182 170 221 120 238 C70 221 27 182 27 128 L45 50 Z"
        fill="none" stroke="url(#goldGrad1)" stroke-width="1.6" stroke-opacity="0.78"/>

  <!-- Crown: 8-pointed heritage star (8 branches) -->
  <g transform="translate(120, 48)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#goldGrad1)"/>
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#goldGrad1)" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="3.4" fill="#12372A"/>
  </g>

  <!-- Qiya & Basal desert mountain peaks backdrop -->
  <path d="M36 154 L76 112 L104 138 L142 98 L178 134 L204 152 L204 164 L36 164 Z"
        fill="#1E523F" opacity="0.72"/>

  <!-- Historic Qiya tapered stone watchtower (حصن قيا الحجري) -->
  <g>
    <!-- Battlements (الشرفات) -->
    <path d="M70 84 H80 V91 H87 V84 H97 V91 H104 V84 H114 V96 H70 Z" fill="url(#goldGrad1)"/>
    <!-- Tapered tower body -->
    <polygon points="73,96 111,96 118,168 66,168" fill="#F8F4EC"/>
    <polygon points="73,96 111,96 118,168 66,168" fill="none" stroke="url(#goldGrad1)" stroke-width="1.8"/>
    <!-- Traditional stone masonry courses -->
    <line x1="71.5" y1="112" x2="112.5" y2="112" stroke="#12372A" stroke-width="1.2" stroke-opacity="0.32"/>
    <line x1="69.5" y1="128" x2="114.5" y2="128" stroke="#12372A" stroke-width="1.2" stroke-opacity="0.32"/>
    <line x1="67.8" y1="144" x2="116.2" y2="144" stroke="#12372A" stroke-width="1.2" stroke-opacity="0.32"/>
    <!-- Decorative stone belt & narrow watchtower slits (مزاغل) -->
    <polygon points="72,102 112,102 113,106 71,106" fill="url(#goldGrad1)"/>
    <rect x="83" y="116" width="3.5" height="10" rx="1.5" fill="#12372A"/>
    <rect x="97.5" y="116" width="3.5" height="10" rx="1.5" fill="#12372A"/>
    <!-- Arched fortress gate -->
    <path d="M84 168 V152 C84 147 100 147 100 152 V168 Z" fill="#12372A"/>
  </g>

  <!-- Flowing desert sand dunes (الكثبان الصحراوية) -->
  <path d="M31 168 C68 156 105 170 144 160 C174 152 195 158 209 166 L205 186 C168 208 145 218 120 226 C95 218 68 206 35 184 Z"
        fill="url(#goldGrad1)" opacity="0.22"/>
  <path d="M32 174 C72 162 118 178 164 164 C185 158 198 161 208 167"
        stroke="url(#goldGrad1)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M44 190 C84 182 128 194 196 178"
        stroke="url(#goldGrad1)" stroke-width="1.4" stroke-opacity="0.7" stroke-linecap="round" fill="none"/>

  <!-- Proud Arabian Camel Silhouette striding right-to-left / toward fortress (أهل الإبل) -->
  <g transform="translate(110, 108) scale(0.95)">
    <path d="M54 4 C56 2 60 2 63 3 C66 4 68 6 67 8 C66 10 62 11 58 11 C55 11 53 14 52 19 C51 25 50 32 45 36 C41 39 36 37 33 32 C29 24 23 19 16 19 C10 19 5 24 2 31 C0 36 -1 41 1 46 C2 48 4 50 4 56 L3 68 L7 68 L9 50 C12 49 16 49 20 50 L22 68 L26 68 L25 49 C30 48 35 46 39 45 L41 68 L45 68 L44 43 C48 41 51 39 53 35 C56 30 58 20 59 13 C61 11 64 9 65 7 Z"
          fill="url(#goldGrad1)"/>
    <!-- Subtle camel saddle/neck contour accent -->
    <path d="M12 24 C18 22 24 25 28 31" stroke="#12372A" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Bottom 3 desert stars / subtle horizon dots -->
  <circle cx="105" cy="212" r="2" fill="url(#goldGrad1)"/>
  <circle cx="120" cy="216" r="2.8" fill="url(#goldGrad1)"/>
  <circle cx="135" cy="212" r="2" fill="url(#goldGrad1)"/>
</svg>
